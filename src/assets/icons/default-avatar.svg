<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 轻提词 V4.8.6 默认头像：靛蓝渐变底 + 白色抽象人像。
       不用文字、不依赖外部字体/图片；几何形状简单，缩到 22px（顶栏）也认得出。 -->
  <defs>
    <linearGradient id="mp-avatar-bg" x1="30" y1="18" x2="226" y2="242" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A8CFF"/>
      <stop offset=".52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="mp-avatar-glow" cx="0" cy="0" r="1" gradientTransform="translate(188 46) rotate(48) scale(168)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#mp-avatar-bg)"/>
  <rect width="256" height="256" fill="url(#mp-avatar-glow)"/>
  <g fill="#FFFFFF">
    <!-- 头 -->
    <circle cx="128" cy="97" r="38"/>
    <!-- 肩：饱满的半圆，贴到画布底边，由容器圆角统一裁切 -->
    <path d="M128 147c-46.4 0-84 29.9-84 66.8V256h168v-42.2c0-36.9-37.6-66.8-84-66.8z"/>
  </g>
</svg>
